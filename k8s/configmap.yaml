  NODE_ENV: "production"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  DEPARTMENT_NAME: "Department of Computer Science & Engineering"
  INSTITUTION_NAME: "National Institute of Technology"
  HOD_DISPLAY_NAME: "Dr. A. Sharma (Head of Department)"
