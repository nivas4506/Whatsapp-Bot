name: Continuous Deployment

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  publish-container:
    name: Build & Publish Container Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-webhook:
    name: Trigger Automated Cloud Deployment
    runs-on: ubuntu-latest
    needs: publish-container
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Invoke Deploy Webhook (Render / Cloud VPS)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering automated cloud deployment webhook..."
            curl -s -X POST "$DEPLOY_HOOK_URL"
            echo "Cloud deployment triggered successfully!"
          else
            echo "DEPLOY_HOOK_URL secret not set. Skipping webhook trigger. (Deploying via GitHub native integration or manual trigger)"
          fi
